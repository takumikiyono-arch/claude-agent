name: Slack Mention Reminder

on:
  schedule:
    # 毎時0分に実行 (UTC)。スクリプト側でJST 8〜19時の判定を行う。
    # JST = UTC+9 なので、UTC 23:00〜10:00 が JST 8:00〜19:00 に相当する。
    - cron: '0 23 * * *'   # JST 08:00
    - cron: '0 0 * * *'    # JST 09:00
    - cron: '0 1 * * *'    # JST 10:00
    - cron: '0 2 * * *'    # JST 11:00
    - cron: '0 3 * * *'    # JST 12:00
    - cron: '0 4 * * *'    # JST 13:00
    - cron: '0 5 * * *'    # JST 14:00
    - cron: '0 6 * * *'    # JST 15:00
    - cron: '0 7 * * *'    # JST 16:00
    - cron: '0 8 * * *'    # JST 17:00
    - cron: '0 9 * * *'    # JST 18:00
    - cron: '0 10 * * *'   # JST 19:00
  workflow_dispatch: {}

jobs:
  check-mentions:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Slack mention check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python check_slack_mentions.py
